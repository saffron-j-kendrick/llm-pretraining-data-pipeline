[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "llm-pretraining-data-pipeline"
version = "0.1.0"
description = "Pipeline for cleaning and filtering text for LLM processing"
requires-python = ">3.10"
dependencies = [
    "beautifulsoup4",
    "datasets",
    "datasketch",
    "nltk",
    "tiktoken"
]


[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]